name: bc-election-ingestion

x-job: &job
  image: bc-election-ingestion:local
  build:
    context: .
  user: "${INGESTION_UID:-1000}:${INGESTION_GID:-1000}"
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes:
    - ${INGESTION_STORAGE:-./storage}:/data
    - ${INGESTION_CONFIG:-./config.json}:/app/config.json:ro
    - ../content-server/content:/content:ro
  environment:
    BC_GUIDE_CONTENT: /content
  command: []
  profiles: [jobs]

x-model-env: &model-env
  BC_GUIDE_CONTENT: /content
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

services:
  normalize:
    <<: *job
    entrypoint: [python, -m, election.jobs, normalize, --storage, /data, --config, /app/config.json]

  records:
    <<: *job
    entrypoint: [python, -m, election.jobs, records, --storage, /data, --config, /app/config.json]

  discover:
    <<: *job
    entrypoint: [python, -m, election.jobs, discover, --storage, /data, --config, /app/config.json]

  platforms:
    <<: *job
    entrypoint: [python, -m, election.jobs, platforms, --storage, /data, --config, /app/config.json]

  transcripts:
    <<: *job
    entrypoint: [python, -m, election.jobs, transcripts, --storage, /data, --config, /app/config.json]

  profiles:
    <<: *job
    entrypoint: [python, -m, election.jobs, profiles, --storage, /data, --config, /app/config.json]

  plan:
    <<: *job
    entrypoint: [python, -m, election.jobs, plan, --storage, /data, --config, /app/config.json]

  refresh-publication:
    <<: *job
    entrypoint: [python, -m, election.jobs, refresh-publication, --storage, /data, --config, /app/config.json]

  identity-review:
    <<: *job
    entrypoint: [python, -m, election.jobs, identity-review, --storage, /data, --config, /app/config.json]
    environment: *model-env

  curate:
    <<: *job
    entrypoint: [python, -m, election.jobs, curate, --storage, /data, --config, /app/config.json]

  research:
    <<: *job
    entrypoint: [python, -m, election.jobs, research, --storage, /data, --config, /app/config.json]
    environment: *model-env

  evidence:
    <<: *job
    entrypoint: [python, -m, election.jobs, evidence, --storage, /data, --config, /app/config.json]

  comparison:
    <<: *job
    entrypoint: [python, -m, election.jobs, comparison, --storage, /data, --config, /app/config.json]
    environment: *model-env

  source-review:
    <<: *job
    entrypoint: [python, -m, election.jobs, source-review, --storage, /data, --config, /app/config.json]
    environment: *model-env

  publish:
    <<: *job
    entrypoint: [python, -m, election.jobs, publish, --storage, /data, --config, /app/config.json]

  finder-data:
    <<: *job
    entrypoint: [python, -m, election.jobs, finder-data, --storage, /data, --config, /app/config.json]

  test:
    <<: *job
    entrypoint: [python, -m, election.jobs, test, --storage, /data, --config, /app/config.json]
